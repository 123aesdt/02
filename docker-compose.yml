name: countyflow-ai

services:
  mysql:
    image: mysql:8.4
    environment:
      MYSQL_DATABASE: ${MYSQL_DATABASE:?MYSQL_DATABASE is required}
      MYSQL_USER: ${MYSQL_USER:?MYSQL_USER is required}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:?MYSQL_PASSWORD is required}
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:?MYSQL_ROOT_PASSWORD is required}
    ports:
      - "3306:3306"
    volumes:
      - countyflow_mysql:/var/lib/mysql
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h localhost -uroot -p$$MYSQL_ROOT_PASSWORD"]
      interval: 5s
      timeout: 5s
      retries: 30
    networks:
      - default
      - host_access

  redis:
    image: redis:8.2.9-alpine
    command: ["redis-server", "--appendonly", "yes"]
    ports:
      - "6380:6379"
    volumes:
      - countyflow_redis:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 30
    networks:
      - default
      - host_access

  qdrant:
    build:
      context: .
      dockerfile: infra/qdrant.Dockerfile
    ports:
      - "6333:6333"
    volumes:
      - countyflow_qdrant:/qdrant/storage
    healthcheck:
      test: ["CMD", "bash", "-c", "exec 3<>/dev/tcp/127.0.0.1/6333 && printf 'GET /collections HTTP/1.0\\r\\n\\r\\n' >&3 && read -r status <&3 && [[ $$status == *' 200 '* ]]"]
      interval: 5s
      timeout: 5s
      retries: 30
    networks:
      - default
      - host_access

  neo4j:
    image: neo4j:5.26-community
    entrypoint:
      - tini
      - -g
      - --
      - sh
      - -ec
      - |
        if [ -s /data/dbms/auth.ini ]; then
          unset NEO4J_AUTH
        fi
        exec /startup/docker-entrypoint.sh neo4j
    environment:
      NEO4J_AUTH: ${NEO4J_USER:-neo4j}/${NEO4J_PASSWORD:?NEO4J_PASSWORD is required}
      CF_NEO4J_PASSWORD: ${NEO4J_PASSWORD:?NEO4J_PASSWORD is required}
      NEO4J_server_default__listen__address: ${NEO4J_LISTEN_ADDRESS:-0.0.0.0}
      NEO4J_dbms_security_auth__enabled: ${NEO4J_AUTH_ENABLED:-true}
    ports:
      - "7474:7474"
      - "7687:7687"
    volumes:
      - countyflow_neo4j:/data
    healthcheck:
      test: ["CMD-SHELL", "cypher-shell -a bolt://localhost:7687 -u ${NEO4J_USER:-neo4j} -p $$CF_NEO4J_PASSWORD 'RETURN 1' >/dev/null 2>&1"]
      interval: 5s
      timeout: 5s
      retries: 30
    networks:
      - default
      - host_access

  migration:
    build:
      context: ./backend
    command: ["sh", "-c", "alembic upgrade head && python -m app.seed"]
    environment: &backend_environment
      RUNTIME_PROFILE: docker-dev
      AUTHENTICATION_PROVIDER: ${AUTHENTICATION_PROVIDER:?AUTHENTICATION_PROVIDER is required}
      AUTH_ISSUER: ${AUTH_ISSUER:-countyflow-dev}
      AUTH_AUDIENCE: ${AUTH_AUDIENCE:-countyflow-api}
      DEVELOPMENT_JWT_SECRET: ${DEVELOPMENT_JWT_SECRET:?DEVELOPMENT_JWT_SECRET is required}
      DATABASE_URL: mysql+pymysql://${MYSQL_USER:?MYSQL_USER is required}:${MYSQL_PASSWORD:?MYSQL_PASSWORD is required}@mysql:3306/${MYSQL_DATABASE:?MYSQL_DATABASE is required}
      DATABASE_BACKEND: mysql
      REDIS_URL: redis://redis:6379/0
      REDIS_BACKEND: server
      RUNTIME_CHECKPOINT_BACKEND: redis
      RUNTIME_CHECKPOINT_NAMESPACE: countyflow
      RUNTIME_CHECKPOINT_RETENTION_MINUTES: 10080
      RUNTIME_CHECKPOINT_REFRESH_ON_READ: false
      RUNTIME_CHECKPOINT_MAX_BYTES: 1048576
      RUNTIME_CHECKPOINT_RECONCILIATION_SCAN_LIMIT: 10
      RUNTIME_CHECKPOINT_INTERRUPT_AFTER: environment
      RUNTIME_THREAD_API_ENABLED: true
      RUNTIME_THREAD_HISTORY_LIMIT: 20
      RUNTIME_THREAD_HISTORY_MAX_LIMIT: 100
      RUNTIME_OVERRIDE_API_ENABLED: true
      RUNTIME_OVERRIDE_TIMEOUT_SECONDS: 5.0
      RUNTIME_OVERRIDE_LOCK_TTL_MS: 8000
      QDRANT_URL: http://qdrant:6333
      QDRANT_BACKEND: server
      GRAPH_MEMORY_BACKEND: neo4j
      NEO4J_URI: bolt://neo4j:7687
      NEO4J_USER: ${NEO4J_USER:-neo4j}
      NEO4J_PASSWORD: ${NEO4J_PASSWORD:?NEO4J_PASSWORD is required}
      NEO4J_DATABASE: ${NEO4J_DATABASE:-neo4j}
      TASK_EVENT_BROKER: redis
      WORKER_BLOCK_MS: 250
      WORKER_PENDING_MIN_IDLE_MS: 4000
      WORKER_RETRY_BASE_DELAY_MS: 100
      WORKER_IDEMPOTENCY_LOCK_TTL_MS: 2000
      CORS_ALLOWED_ORIGINS: http://localhost:5173
      EMBEDDING_PROVIDER: fake
      EMBEDDING_MODEL: development-deterministic-128
      ENVIRONMENT_PROVIDER: docker-development
      CAPACITY_PROVIDER: in-memory
      ROUTING_PROVIDER: in-memory
      MEMORY_AUTO_APPLY_MIN_CONFIDENCE: 0.75
      MEMORY_LOWER_CONFIDENCE_REJECT_DELTA: 0.15
      MEMORY_MUTATION_TIMEOUT_SECONDS: 5.0
      MEMORY_MUTATION_LOCK_TTL_MS: 10000
      MEMORY_MUTATION_API_ENABLED: true
      METRICS_ENABLED: ${METRICS_ENABLED:-true}
      METRICS_HOST: 0.0.0.0
      METRICS_PORT: 9100
      OBSERVABILITY_API_ENABLED: true
      OBSERVABILITY_SAMPLE_INTERVAL_SECONDS: 15
      OBSERVABILITY_PROBE_TIMEOUT_SECONDS: 0.8
      PROMETHEUS_URL: http://prometheus:9090
      GRAFANA_PUBLIC_URL: http://localhost:${GRAFANA_PORT:-3000}
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_healthy
      qdrant:
        condition: service_healthy
      neo4j:
        condition: service_healthy

  backend:
    build:
      context: ./backend
    environment: *backend_environment
    ports:
      - "8001:8000"
    depends_on:
      migration:
        condition: service_completed_successfully
      redis:
        condition: service_healthy
      qdrant:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import urllib.request; urllib.request.urlopen('http://localhost:8000/health')\""]
      interval: 5s
      timeout: 5s
      retries: 30
    networks:
      - default
      - host_access

  worker-1:
    build:
      context: ./backend
    command: ["python", "-m", "app.worker_entrypoint"]
    environment:
      <<: *backend_environment
      WORKER_CONSUMER_NAME: worker-1
      RUNTIME_OVERRIDE_API_ENABLED: false
      RUNTIME_CHECKPOINT_INTERRUPT_AFTER: ${RUNTIME_CHECKPOINT_INTERRUPT_AFTER:-environment}
    depends_on:
      migration:
        condition: service_completed_successfully
      redis:
        condition: service_healthy
      qdrant:
        condition: service_healthy
    restart: unless-stopped
    networks:
      - default
      - host_access

  worker-2:
    build:
      context: ./backend
    command: ["python", "-m", "app.worker_entrypoint"]
    environment:
      <<: *backend_environment
      WORKER_CONSUMER_NAME: worker-2
      RUNTIME_OVERRIDE_API_ENABLED: false
      RUNTIME_CHECKPOINT_INTERRUPT_AFTER: ""
    depends_on:
      migration:
        condition: service_completed_successfully
      redis:
        condition: service_healthy
      qdrant:
        condition: service_healthy
    restart: unless-stopped
    networks:
      - default
      - host_access

  frontend:
    build:
      context: ./frontend
      args:
        VITE_DATA_MODE: api
        VITE_API_BASE_URL: http://localhost:8001
        VITE_AUTHENTICATION_MODE: development_jwt
        VITE_RUNTIME_THREAD_STATE_ENABLED: true
        VITE_AMAP_KEY: ${VITE_AMAP_KEY:-}
        VITE_AMAP_SECURITY_CODE: ${VITE_AMAP_SECURITY_CODE:-}
    ports:
      - "5173:80"
    depends_on:
      backend:
        condition: service_healthy
    networks:
      - default
      - host_access

  prometheus:
    image: prom/prometheus:v3.5.0
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.path=/prometheus
      - --storage.tsdb.retention.time=7d
    volumes:
      - ./monitoring/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - ./monitoring/prometheus/rules:/etc/prometheus/rules:ro
      - countyflow_prometheus:/prometheus
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O /dev/null http://localhost:9090/-/ready"]
      interval: 5s
      timeout: 5s
      retries: 30
    networks:
      - default

  grafana:
    image: grafana/grafana:12.1.0
    environment:
      GF_SECURITY_ADMIN_USER: ${GRAFANA_ADMIN_USER:?GRAFANA_ADMIN_USER is required}
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD:?GRAFANA_ADMIN_PASSWORD is required}
      GF_USERS_ALLOW_SIGN_UP: "false"
      GF_AUTH_ANONYMOUS_ENABLED: "false"
    ports:
      - "${GRAFANA_PORT:-3000}:3000"
    volumes:
      - ./monitoring/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./monitoring/grafana/dashboards:/var/lib/grafana/dashboards:ro
      - countyflow_grafana:/var/lib/grafana
    depends_on:
      prometheus:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O /dev/null http://localhost:3000/api/health"]
      interval: 5s
      timeout: 5s
      retries: 30
    networks:
      - default
      - host_access

volumes:
  countyflow_mysql:
  countyflow_redis:
  countyflow_qdrant:
  countyflow_neo4j:
  countyflow_prometheus:
  countyflow_grafana:

networks:
  default:
    name: countyflow_internal
    internal: true
  host_access:
    name: countyflow_host_access

global:
  scrape_interval: 15s
  scrape_timeout: 5s

rule_files:
  - /etc/prometheus/rules/countyflow-recording.yml
  - /etc/prometheus/rules/countyflow-alerts.yml

scrape_configs:
  - job_name: backend
    static_configs:
      - targets: ["backend:9100"]
  - job_name: worker-1
    static_configs:
      - targets: ["worker-1:9100"]
  - job_name: worker-2
    static_configs:
      - targets: ["worker-2:9100"]
